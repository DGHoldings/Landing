<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Landing Sri Lanka Simple</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+Sinhala:wght@500;700&family=Noto+Sans+Sinhala:wght@400;500&display=swap">
<style>
body{margin:0}
/* Layout: one calm screen, a name card in the brochure's navy and gold with the brochure logo. */
:root{
  --bg:#273057; --card:#ffffff; --fg:#273057; --muted:#6f7184; --line:#e2d3bd; --seal:#ba905b; --gold:#ba905b;
  --display:"Noto Serif SC","Noto Serif Sinhala",Georgia,serif;
  --body:"Noto Sans SC","Noto Sans Sinhala",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);line-height:1.7;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{width:100%;max-width:640px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:44px 40px;display:grid;gap:26px;position:relative}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.seal{height:56px;width:auto}
.langs{display:flex;gap:4px;font-size:13px}
.langs button{all:unset;cursor:pointer;padding:4px 10px;border-radius:3px;color:var(--muted)}
.langs button[aria-pressed="true"]{color:var(--fg);background:var(--bg);font-weight:500}
.langs button:focus-visible{outline:2px solid var(--gold)}
.name{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
h1{font-family:var(--display);font-size:clamp(1.6rem,4.5vw,2.3rem);line-height:1.35;margin:6px 0 0;text-wrap:balance}
p{margin:0;color:var(--muted)}
.areas{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0;list-style:none}
.areas li{color:var(--fg);font-size:13px;border:1px solid var(--line);padding:3px 10px;border-radius:999px}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 20px;border-top:1px solid var(--line);padding-top:22px;font-size:15px}
dt{color:var(--muted);font-size:13px}
dd{margin:0;overflow-wrap:anywhere}
.tbc{font-size:11px;color:var(--muted);border:1px dashed var(--line);padding:0 6px;border-radius:3px;margin-left:6px}
small{font-size:12px;color:var(--muted)}
.mailbar{position:fixed;top:0;left:0;right:0;z-index:5;background:var(--gold);color:#fff;text-align:center;font-weight:500;letter-spacing:.03em;padding-block:calc(7px + env(safe-area-inset-top,0px)) 7px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));user-select:all}
body{padding-top:72px}
@media (max-width:480px){.card{padding:28px 20px}}
</style>
</head>
